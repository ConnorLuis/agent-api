name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Strict test suite (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile source without warnings
        run: |
          python -W error -m compileall -q src scripts tests

      - name: Run tests
        env:
          LLM_PROVIDER: mock
          NEO4J_ENABLED: "false"
          AGENT_API_MAIN_AGENT_MCP_ENABLED: "false"
        run: |
          python -m pytest -q
